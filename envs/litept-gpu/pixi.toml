# GPU environment for LitePT pre-training / fine-tuning and ForPT embeddings (Bridges-2, NCSA Delta).
# The env is ~14 GB. Where it goes is machine configuration, not repo configuration (a project-local
# .pixi/config.toml would override every machine), so set it per cluster in the user-level pixi config if $HOME is small:
#   Bridges-2:  pixi config set --global detached-environments /ocean/projects/bio260075p/sammlapp/pixi_envs
#   Delta:      not needed (home quota 100 GB); installs into envs/litept-gpu/.pixi
# Install (from a CPU node, CUDA must be mocked):
#   export PIXI_CACHE_DIR=<big scratch>/.pixi_cache   # Bridges-2: /ocean/projects/bio260075p/sammlapp/.pixi_cache
#   CONDA_OVERRIDE_CUDA=12.6 pixi install --manifest-path envs/litept-gpu/pixi.toml
[workspace]
channels = ["conda-forge"]
name = "eagle-litept-gpu"
platforms = ["linux-64"]

[system-requirements]
cuda = "12"

[dependencies]
python = "3.13.*"
pytorch-gpu = ">=2.13,<3"
flash-attn = ">=2.8,<3"        # used on Ampere+/Hopper GPUs (L40S, H100); V100 falls back to SDPA
pytorch_scatter = ">=2.1,<3"
timm = "*"
addict = "*"
scipy = "*"
python-pdal = ">=3.5.5,<4"
geopandas = ">=1.1,<2"
pyarrow = "*"
pandas = "*"
tensorboard = "*"
matplotlib = "*"
tqdm = "*"
ipykernel = "*"
cuda-version = "12.*"

[pypi-dependencies]
spconv-cu126 = ">=2.3.8,<2.4"
