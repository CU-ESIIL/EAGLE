# GPU environment for LitePT pre-training / fine-tuning on Bridges-2.
# Environments are installed on /ocean (see .pixi/config.toml) because $HOME is too small.
# Install (from a CPU node, CUDA must be mocked):
#   export PIXI_CACHE_DIR=/ocean/projects/bio260075p/sammlapp/.pixi_cache
#   CONDA_OVERRIDE_CUDA=12.6 pixi install --manifest-path envs/litept-gpu/pixi.toml
[workspace]
channels = ["conda-forge"]
name = "eagle-litept-gpu"
platforms = ["linux-64"]

[system-requirements]
cuda = "12"

[dependencies]
python = "3.13.*"
pytorch-gpu = ">=2.13,<3"
flash-attn = ">=2.8,<3"        # used on Ampere+/Hopper GPUs (L40S, H100); V100 falls back to SDPA
pytorch_scatter = ">=2.1,<3"
timm = "*"
addict = "*"
scipy = "*"
python-pdal = ">=3.5.5,<4"
geopandas = ">=1.1,<2"
pyarrow = "*"
pandas = "*"
tensorboard = "*"
matplotlib = "*"
tqdm = "*"
ipykernel = "*"
cuda-version = "12.*"

[pypi-dependencies]
spconv-cu126 = ">=2.3.8,<2.4"
