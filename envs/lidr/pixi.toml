# R environment for standard lidar metrics (lidR::stdmetrics + terrain) on the cached benchmark cookies.
#   pixi install --manifest-path envs/lidr/pixi.toml
[workspace]
channels = ["conda-forge"]
name = "eagle-lidr"
platforms = ["linux-64"]  # r-lidr has no osx-arm64 build on conda-forge

[dependencies]
r-base = "4.4.*"
r-lidr = ">=4.3"
r-arrow = "*"
"r-data.table" = "*"
r-terra = "*"
